<aside id="rail" aria-label="Navigation"></aside>
<header id="pageHead">
  <h1 id="pageTitle">Home</h1>
  <div id="pageStatus"><span id="pageStatusText" aria-live="polite">Loading…</span><button type="button" class="help" id="pageHelp" aria-label="More about this page" hidden>?</button></div>
  <button type="button" id="pageWaiting" hidden></button>
  <div id="pageActions"><button type="button" id="refresh" title="Rebuild now">Refresh</button></div>
</header>

<main>
  <div class="banners" id="banners" role="status"></div>

  <section id="home" aria-label="Overview">
    <div id="homeSince" hidden></div>
    <div id="homeHuman" hidden></div>
    <div id="homeOutputs" data-cv-line hidden></div>
    <div id="homeAlerts" data-pe-home hidden></div>
    <div id="homePrs" data-prl hidden></div>
    <div id="homeInsight" data-insight-home hidden></div>

    <div class="home-zone">
      <div class="section-head"><h2>Agents <span class="faint">· <span class="num" id="agentsCount">–</span></span></h2></div>
      <div class="agent-cards ac-grid ac-chat-slot" id="chatCardHome" hidden></div>
      <div class="agent-cards ac-grid" id="agentCards"></div>
    </div>

    <div class="home-zone" id="homeSubagentsZone" hidden>
      <div class="section-head"><h2>Subagents <span class="faint">· <span class="num" id="subagentsCount">0</span> running</span></h2><a class="link" href="#/subagents">All subagents</a></div>
      <div class="card hp-strip" id="homeSubagents"></div>
    </div>

    <div class="home-zone">
      <div class="section-head"><h2>Messages <span class="faint">· <span class="num" id="talkCount">–</span></span></h2></div>
      <div class="card talk scroll" id="talk" data-fade="tb"></div>
    </div>
  </section>

  <section id="flowView" aria-label="Timeline" hidden></section>
  <section id="agentView" aria-label="One agent" hidden></section>
  <section id="factoryView" aria-label="Tickets" hidden></section>
  <section id="flowsView" aria-label="Flows" hidden></section>
  <section id="agentsView" aria-label="Agents" hidden></section>
  <section id="subagentsView" aria-label="Subagents" hidden></section>
  <section id="glossaryView" aria-label="Glossary" hidden></section>
  <section id="settingsView" aria-label="Settings" hidden></section>
  <section id="qaView" aria-label="QA" hidden></section>
  <section id="scriptView" aria-label="Generators" hidden></section>
  <section id="archiveView" aria-label="Flow archive" hidden></section>
  <section id="bankView" aria-label="Orchestration bank" hidden></section>
  <section id="lessonsView" aria-label="Lessons" hidden></section>
  <section id="routingView" aria-label="Routing" hidden></section>
  <section id="learnView" aria-label="Learn" hidden></section>
  <section id="suggestionsView" aria-label="Suggestions" hidden></section>
  <section id="healthView" aria-label="Health" hidden></section>
</main>
